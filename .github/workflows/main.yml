
name: Validate application

on:
  push:
    branches:
      - RH
      - systm
  pull_request:
    branches:
      - RH

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app.py server.py ia leitor

      - name: Validate server health configuration
        run: |
          python - <<'PY'
          from server import health

          assert health() == {"status": "ok", "ai_configured": "false"}
          PY
